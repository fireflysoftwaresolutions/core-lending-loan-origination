components:
  schemas:
    LoanApplicationDTO:
      required:
      - applicationDate
      - applicationStatusId
      - applicationSubStatusId
      - submissionChannelId
      type: object
      properties:
        loanApplicationId:
          type: string
          format: uuid
          readOnly: true
        applicationNumber:
          type: string
          format: uuid
        applicationStatusId:
          type: string
          format: uuid
        applicationSubStatusId:
          type: string
          format: uuid
        applicationDate:
          type: string
          format: date
        submissionChannelId:
          type: string
          format: uuid
        distributorId:
          type: string
          format: uuid
        distributorAgencyId:
          type: string
          format: uuid
        distributorAgentId:
          type: string
          format: uuid
        businessUnit:
          type: string
        branchId:
          type: string
          format: uuid
        loanPurpose:
          type: string
        loanPurposeDescription:
          type: string
        submittedAt:
          type: string
          format: date-time
        firstReviewAt:
          type: string
          format: date-time
        decisionDueDate:
          type: string
          format: date
        expectedClosingDate:
          type: string
          format: date
        loanOfficerId:
          type: string
          format: uuid
        assignedAt:
          type: string
          format: date-time
        isRush:
          type: boolean
        isException:
          type: boolean
        requiresManualReview:
          type: boolean
        externalReferenceNumber:
          type: string
        sourceSystem:
          type: string
        disbursementMethodType:
          type: string
          enum:
          - INTERNAL_ACCOUNT
          - EXTERNAL_ACCOUNT
        disbursementInternalAccountId:
          type: string
          format: uuid
        disbursementExternalBankAccountId:
          type: string
          format: uuid
        paymentCollectionMethodType:
          type: string
          enum:
          - INTERNAL_ACCOUNT
          - EXTERNAL_ACCOUNT
        paymentCollectionInternalAccountId:
          type: string
          format: uuid
        paymentCollectionExternalBankAccountId:
          type: string
          format: uuid
        note:
          maxLength: 1000
          minLength: 0
          type: string
        simulationId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ApplicationVerificationDTO:
      required:
      - loanApplicationId
      - verificationStatus
      - verificationType
      type: object
      properties:
        verificationId:
          type: string
          format: uuid
          readOnly: true
        loanApplicationId:
          type: string
          format: uuid
        verificationType:
          maxLength: 50
          minLength: 0
          type: string
        verificationStatus:
          maxLength: 50
          minLength: 0
          type: string
        verificationMethod:
          maxLength: 50
          minLength: 0
          type: string
        verifiedBy:
          type: string
        verifiedAt:
          type: string
          format: date-time
        verificationData:
          type: string
        notes:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ApplicationTaskDTO:
      required:
      - loanApplicationId
      - taskType
      type: object
      properties:
        taskId:
          type: string
          format: uuid
          readOnly: true
        loanApplicationId:
          type: string
          format: uuid
        taskType:
          maxLength: 50
          minLength: 0
          type: string
        taskStatus:
          maxLength: 50
          minLength: 0
          type: string
        priority:
          maxLength: 20
          minLength: 0
          type: string
        assignedTo:
          type: string
        assignedAt:
          type: string
          format: date-time
        dueDate:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
        completedBy:
          type: string
        description:
          maxLength: 1000
          minLength: 0
          type: string
        notes:
          maxLength: 2000
          minLength: 0
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    LoanApplicationStatusHistoryDTO:
      required:
      - changedAt
      - changedBy
      - loanApplicationId
      - newStatus
      - oldStatus
      type: object
      properties:
        statusHistoryId:
          type: string
          format: uuid
          readOnly: true
        loanApplicationId:
          type: string
          format: uuid
        oldStatus:
          type: string
          enum:
          - DRAFT
          - SUBMITTED
          - UNDER_REVIEW
          - APPROVED
          - REJECTED
          - CANCELLED
        newStatus:
          type: string
          enum:
          - DRAFT
          - SUBMITTED
          - UNDER_REVIEW
          - APPROVED
          - REJECTED
          - CANCELLED
        changeReason:
          maxLength: 500
          minLength: 0
          type: string
        changedAt:
          type: string
          format: date-time
        changedBy:
          maxLength: 100
          minLength: 0
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
